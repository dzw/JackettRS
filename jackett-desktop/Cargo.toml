[package]
name = "jackett-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "JackettRS desktop shell — embeds the Jackett server and shows its Web UI in a native window"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jackett-server = { path = "../jackett-server" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
