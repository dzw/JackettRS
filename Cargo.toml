[workspace]
resolver = "2"
members = [
    "jackett-common",
    "jackett-server",
    "jackett-service",
    "jackett-tray",
    "jackett-updater",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"
anyhow = "1"
thiserror = "1"
url = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "gzip", "json", "rustls-tls", "http2", "charset"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
scraper = "0.19"
quick-xml = "0.31"
base64 = "0.22"

[profile.release]
lto = true
